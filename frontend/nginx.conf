server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança — relevantes sobretudo se FRONTEND_HOST_BIND
    # for trocado pra 0.0.0.0 (LAN/VPS, ver README "Segurança"). Sem
    # X-Frame-Options/frame-ancestors, a tela de login podia ser embutida
    # num <iframe> de outro site (clickjacking). Referrer-Policy evita que
    # navegar pra um link externo a partir de uma página com ?token= na URL
    # (export/screenshot) vaze esse token pro Referer do outro site.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Proxy transparente para o backend — o browser nunca fala direto com a
    # API, então não há CORS a configurar.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Defesa em profundidade para o upload de wordlist customizada: nginx
        # rejeita corpos grandes antes de chegar no backend. Um pouco acima
        # do teto real (MAX_WORDLIST_BYTES, padrão 5MiB) pra não cortar antes
        # da mensagem de erro clara do backend; o teto que vale de verdade é
        # o do backend, configurável via .env.
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
