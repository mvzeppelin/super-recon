name: super-recon

networks:
  recon-net:
    name: recon-net
    driver: bridge

volumes:
  redis-data:
  opensearch-data:

services:
  redis:
    image: redis:7-alpine
    container_name: recon-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - recon-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sem "ports": só acessível por outros containers na rede recon-net.

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: recon-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=super-recon-cluster
      - node.name=recon-opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # Diretório liberado pro registro de um repositório de snapshot (tipo
      # "fs") — sem isso, PUT _snapshot/... falha com "location not allowed".
      # Ver README "Backup do OpenSearch".
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./data/opensearch-snapshots:/usr/share/opensearch/snapshots
    networks:
      - recon-net
    ports:
      # Bind só em 127.0.0.1 (host local) — nunca em 0.0.0.0.
      # Containers da recon-net acessam via nome de serviço "opensearch", sem passar por essa porta.
      - "${OPENSEARCH_HOST_BIND}:9200:9200"
    healthcheck:
      # A senha vai entre aspas simples de propósito: sem isso, qualquer
      # caractere especial de shell nela (parênteses, espaço, $, ; etc. —
      # bem provável numa senha "forte" de verdade) quebra o parsing do
      # comando dentro do container e o healthcheck nunca fica "healthy"
      # (visto na prática, deploy travado com "syntax error near unexpected
      # token").
      test: ["CMD-SHELL", "curl -sk -u 'admin:${OPENSEARCH_ADMIN_PASSWORD}' https://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  opensearch-init:
    image: curlimages/curl:8.11.0
    container_name: recon-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - recon-net
    environment:
      - OPENSEARCH_ADMIN_USER=${OPENSEARCH_ADMIN_USER}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # ILM básico (retenção por grupo de índice) — vazio = sem expiração
      # automática. Ver README "Retenção de dados (ILM)".
      - ILM_SHORT_RETENTION_DAYS=${ILM_SHORT_RETENTION_DAYS:-}
      - ILM_LONG_RETENTION_DAYS=${ILM_LONG_RETENTION_DAYS:-}
    volumes:
      - ./opensearch/templates:/templates:ro
      - ./opensearch/ism-policies:/ism-policies:ro
      - ./opensearch/init-templates.sh:/init-templates.sh:ro
    entrypoint: ["sh", "/init-templates.sh"]
    restart: "no"

  backend:
    build: ./backend
    container_name: recon-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST_EXCHANGE_DIR=${PWD}/data/exchange
      - HOST_WORDLISTS_DIR=${PWD}/data/wordlists
    volumes:
      # Necessário para cancelar jobs: a API mata/remove diretamente o
      # container Kali do job cancelado (docker-outside-of-docker, mesmo
      # trade-off de acesso do worker — ver Etapa 5).
      - /var/run/docker.sock:/var/run/docker.sock
      # Onde os uploads de wordlist customizada (gobuster) são gravados.
      - ./data/wordlists:/wordlists
      # Onde os screenshots do gowitness (GOWITNESS_ENABLED) ficam — o
      # backend só lê daqui pra servir via GET /clients/{client}/screenshots/{id}.
      - ./data/screenshots:/screenshots
    networks:
      - recon-net
    ports:
      # Endereço e porta (host) configuráveis via .env (BACKEND_HOST_BIND/
      # BACKEND_PORT, default 127.0.0.1:8000) — o frontend acessa via
      # recon-net (nome de serviço "backend", sempre porta 8000 interna)
      # independente disso; essa porta só importa para acesso direto à API
      # (curl, scripts). Ver README "Segurança" antes de trocar o bind para
      # 0.0.0.0 sem API_KEY definida.
      - "${BACKEND_HOST_BIND}:${BACKEND_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully

  worker:
    build: ./backend
    container_name: recon-worker
    restart: unless-stopped
    entrypoint: ["/app/entrypoint-worker.sh"]
    env_file: .env
    environment:
      - HOST_EXCHANGE_DIR=${PWD}/data/exchange
      # Só o path (string) — o worker não lê o conteúdo da wordlist ele
      # mesmo, só usa esse valor pra montar o arquivo (read-only) no
      # container efêmero do gobuster via docker.sock (dono do path é o
      # host, não o worker). Por isso não monta ./data/wordlists aqui.
      - HOST_WORDLISTS_DIR=${PWD}/data/wordlists
    volumes:
      - ./data/exchange:/exchange
      # Necessário para o worker criar containers "irmãos" do kali-tools
      # (docker-outside-of-docker) — concede acesso equivalente a root no host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Diferente de wordlists: aqui o worker grava direto (move o
      # screenshot do diretório de troca efêmero pra cá após o gowitness
      # terminar — ver screenshots.py) — não é só um path repassado adiante.
      - ./data/screenshots:/screenshots
    networks:
      - recon-net
    healthcheck:
      # "inspect ping" só dá OK se o processo worker estiver de fato
      # conectado ao broker (Redis) e respondendo — não só vivo.
      test: ["CMD", "celery", "-A", "app.celery_app.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: recon-frontend
    restart: unless-stopped
    networks:
      - recon-net
    ports:
      # Endereço e porta (host) configuráveis via .env (FRONTEND_HOST_BIND/
      # FRONTEND_PORT, default 127.0.0.1:3000) — porta interna do nginx
      # (80) fica fixa, só o lado exposto ao host muda. Ver README
      # "Segurança" antes de trocar o bind para 0.0.0.0/LAN sem API_KEY
      # definida.
      - "${FRONTEND_HOST_BIND}:${FRONTEND_PORT}:80"
    healthcheck:
      # 127.0.0.1 explícito: o nginx da imagem não escuta em ::1 (IPv6), e
      # "localhost" resolve pra ::1 primeiro dentro do container.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
